<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Drone Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .status {
      text-align: center;
      padding: 10px;
      margin-bottom: 20px;
      background: #f0f0f0;
      border-radius: 5px;
    }

    .telemetry {
      background: #f9f9f9;
      border-left: 4px solid #007bff;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 5px;
    }

    .telemetry-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .telemetry-label {
      font-weight: bold;
      color: #007bff;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
    }

    button:hover {
      background: #0056b3;
    }

    .emergency {
      grid-column: 1 / -1;
      background: #dc3545;
    }

    .emergency:hover {
      background: #c82333;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      padding: 10px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<script src="https://cdn.socket.io/4.5.4/socket.io.js"></script>

<script>
  const SERVER = 'http://localhost:3001';

  const socket = io(SERVER);

  socket.on('connect', () => {
    console.log('Connected to server');
  });

  socket.on('arduino:telemetry', (data) => {
    console.log('Received:', data);
    updateTelemetry(data);
  });

  socket.on('arduino:connected', () => {
    document.getElementById('status').textContent = 'Arduino Connected';
  });

  socket.on('arduino:disconnected', () => {
    document.getElementById('status').textContent = 'Arduino Disconnected';
  });

  function updateTelemetry(data) {
    const pairs = data.split(',');

    for (let pair of pairs) {
      const [key, value] = pair.split(':');
      if (key === 'TEMP') {
        document.getElementById('temp').textContent = value + '°C';
      } else if (key === 'HUMIDITY') {
        document.getElementById('humidity').textContent = value + '%';
      } else if (key === 'STATE') {
        document.getElementById('state').textContent = value;
      } else if (key === 'BATTERY') {
        document.getElementById('battery').textContent = value + '%';
      }
    }
  }

  function send(cmd) {
    socket.emit('drone:command', cmd);
  }
</script>

<body>
  <h1>Drone Hangar</h1>

  <div class="status" id="status">Connecting...</div>

  <div class="telemetry">
    <div class="telemetry-item">
      <span class="telemetry-label">Temperatura:</span>
      <span id="temp">--</span>
    </div>
    <div class="telemetry-item">
      <span class="telemetry-label">Umidità:</span>
      <span id="humidity">--</span>
    </div>
    <div class="telemetry-item">
      <span class="telemetry-label">Batteria:</span>
      <span id="battery">--</span>
    </div>
    <div class="telemetry-item">
      <span class="telemetry-label">Stato:</span>
      <span id="state">--</span>
    </div>
  </div>

  <div class="controls">
    <button onclick="send('CMD:ARM')">ARM</button>
    <button onclick="send('CMD:TAKEOFF')">TAKEOFF</button>
    <button onclick="send('CMD:LAND')">LAND</button>
    <button onclick="send('CMD:DISARM')">DISARM</button>
    <button class="emergency" onclick="send('CMD:EMERGENCY')">EMERGENCY</button>
  </div>

  <div class="message" id="message"></div>

  <script>
    const SERVER = 'http://localhost:3001';
    let lastData = {};

    function send(cmd) {
      fetch(SERVER + '/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: cmd })
      })
        .then(r => r.json())
        .then(d => showMsg(cmd + ' sent', 'success'))
        .catch(e => showMsg('Error: ' + e.message, 'error'));
    }

    function showMsg(text, type) {
      const m = document.getElementById('message');
      m.textContent = text;
      m.className = 'message show ' + type;
      setTimeout(() => m.className = 'message', 3000);
    }

    function updateTelemetry(data) {
      const pairs = data.split(',');

      for (let pair of pairs) {
        const [key, value] = pair.split(':');
        if (key === 'TEMP') {
          document.getElementById('temp').textContent = value + '°C';
        } else if (key === 'HUMIDITY') {
          document.getElementById('humidity').textContent = value + '%';
        } else if (key === 'STATE') {
          document.getElementById('state').textContent = value;
        } else if (key === 'BATTERY') {
          document.getElementById('battery').textContent = value + '%';
        }
      }
    }

    function checkStatus() {
      fetch(SERVER + '/api/status')
        .then(r => r.json())
        .then(d => {
          document.getElementById('status').textContent =
            d.connected ? 'Arduino Connected' : 'Arduino Disconnected';
        })
        .catch(() => {
          document.getElementById('status').textContent = 'Server Offline';
        });
    }

    // Aggiorna telemetria ogni volta che il server la riceve
    if (typeof io !== 'undefined') {
      const socket = io(SERVER);
      socket.on('arduino:telemetry', (data) => {
        updateTelemetry(data);
      });
    }

    setInterval(checkStatus, 2000);
    checkStatus();
  </script>
</body>

</html>
