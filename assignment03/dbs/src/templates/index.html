<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Tank Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

  <h1>Smart Tank Monitoring</h1>

  <div class="cards">
    <div class="card">
      <div class="label">Stato</div>
      <div class="value"><span id="state" class="badge">---</span></div>
    </div>
    <div class="card">
      <div class="label">Livello acqua</div>
      <div class="value"><span id="level">---</span> %</div>
    </div>
    <div class="card">
      <div class="label">Valvola</div>
      <div class="value"><span id="valve">---</span> %</div>
    </div>
  </div>

  <h2>Livello (ultime misure)</h2>
  <canvas id="chart" width="600" height="220"></canvas>

  <h2>Modalità</h2>
  <div class="controls">
    <button id="btn-auto" onclick="setMode('AUTOMATIC')">Automatic</button>
    <button id="btn-manual" onclick="setMode('MANUAL')">Manual</button>
  </div>

  <h2>Controllo valvola (solo in MANUAL)</h2>
  <div class="controls">
    <input type="range" min="0" max="100" id="slider" value="0" oninput="onSliderInput(this.value)"
      onchange="setValve(this.value)">
    <span id="slider-value">0</span> %
  </div>

  <script src="/static/js/chart.js"></script>
  <script src="/static/js/dashboard.js"></script>

</body>

</html>
