<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Remote Unit</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 620px;
      margin: 0 auto;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid #ddd;
    }

    th {
      width: 45%;
      font-weight: normal;
      color: #555;
    }

    td {
      font-variant-numeric: tabular-nums;
    }

    .alarm {
      color: #c00;
      font-weight: bold;
    }

    .prealarm {
      color: #b45309;
    }

    .muted {
      color: #999;
    }

    button {
      padding: 10px 16px;
      margin: 12px 6px 0 0;
    }

    /* column-reverse: il browser tiene la vista ancorata in basso da solo,
       quindi non serve leggere scrollHeight per fare autoscroll. */
    #log {
      display: flex;
      flex-direction: column-reverse;
      height: 150px;
      overflow-y: auto;
      margin-top: 12px;
      padding: 8px;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      line-height: 1.5;
      word-break: break-all;
    }

    #log .bad {
      color: #f87171;
    }
  </style>
</head>

<body>

  <h1>Drone Remote Unit</h1>
  <p id="conn">Connessione…</p>

  <table>
    <tr>
      <th>Stato drone</th>
      <td id="drone-state">—</td>
    </tr>
    <tr>
      <th>Stato FSM</th>
      <td id="fsm-state">—</td>
    </tr>
    <tr>
      <th>Stato hangar</th>
      <td id="hangar-state">—</td>
    </tr>
    <tr>
      <th>Distanza</th>
      <td id="distance">—</td>
    </tr>
    <tr>
      <th>Temperatura</th>
      <td id="temperature">—</td>
    </tr>
    <tr>
      <th>PIR</th>
      <td id="pir">—</td>
    </tr>
    <tr>
      <th>Pre-allarme</th>
      <td id="prealarm">—</td>
    </tr>
    <tr>
      <th>Allarme</th>
      <td id="alarm">—</td>
    </tr>
    <tr>
      <th>Ultimo frame</th>
      <td id="age">—</td>
    </tr>
    <tr>
      <th>Frame ricevuti</th>
      <td id="count">0</td>
    </tr>
  </table>

  <div>
    <button id="btn-takeoff" disabled>Decolla</button>
    <button id="btn-land" disabled>Atterra</button>
    <button id="btn-reset" disabled>Reset allarme</button>
  </div>

  <div id="log"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (() => {
      'use strict';

      const TEMP1 = 30.0, TEMP2 = 40.0;
      const socket = io({ transports: ['websocket'], upgrade: false });
      const $ = id => document.getElementById(id);

      const DRONE_STATE = {
        DRONE_INSIDE: 'Fermo',
        TAKE_OFF: 'In decollo',
        DRONE_OUTSIDE: 'In volo',
        LANDING: 'In atterraggio',
        ALARM: 'Bloccato'
      };

      let frames = 0, lastFrameAt = 0;
      let pending = null, scheduled = false, logBuf = [];

      const set = (id, text, cls) => {
        const el = $(id);
        el.textContent = text;
        el.className = cls || '';
      };

      function log(text, bad) {
        logBuf.push({ text: new Date().toLocaleTimeString('it-IT') + '  ' + text, bad });
        schedule();
      }

      function schedule() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(draw);
      }

      // Un solo disegno per frame video, non uno per pacchetto ricevuto.
      function draw() {
        scheduled = false;
        if (pending) { render(pending); pending = null; }
        flushLog();
      }

      function flushLog() {
        if (!logBuf.length) return;
        const box = $('log'), frag = document.createDocumentFragment();
        for (let i = logBuf.length - 1; i >= 0; i--) {
          const d = document.createElement('div');
          if (logBuf[i].bad) d.className = 'bad';
          d.textContent = logBuf[i].text;
          frag.appendChild(d);
        }
        logBuf = [];
        box.insertBefore(frag, box.firstChild);
        while (box.childElementCount > 200) box.removeChild(box.lastElementChild);
      }

      function render(t) {
        $('count').textContent = frames;
        $('fsm-state').textContent = t.state;
        $('drone-state').textContent = DRONE_STATE[t.state] || t.state;

        const hs = (t.hangar || '').toUpperCase();
        set('hangar-state', hs, hs === 'ALARM' ? 'alarm' : hs === 'PREALARM' ? 'prealarm' : '');

        const noEcho = t.distance == null || !isFinite(t.distance) || t.distance >= 999;
        if (noEcho) set('distance', 'NO ECHO', 'muted');
        else set('distance', t.distance.toFixed(1) + ' cm');

        const tempFault = t.temperature == null || !isFinite(t.temperature) ||
          t.temperature < -40 || t.temperature > 125;
        if (tempFault) set('temperature', 'GUASTO', 'alarm');
        else set('temperature', t.temperature.toFixed(1) + ' °C',
          t.temperature >= TEMP2 ? 'alarm' : t.temperature >= TEMP1 ? 'prealarm' : '');

        if (t.pir == null) set('pir', 'n/d', 'muted');
        else set('pir', t.pir ? 'MOVIMENTO' : 'libero', t.pir ? 'prealarm' : 'muted');

        const pre = hs === 'PREALARM' || t.prealarm === true;
        const alm = hs === 'ALARM' || t.alarm === true;
        set('prealarm', pre ? 'ATTIVO' : 'no', pre ? 'prealarm' : 'muted');
        set('alarm', alm ? 'ATTIVO' : 'no', alm ? 'alarm' : 'muted');

        $('btn-takeoff').disabled = t.state !== 'DRONE_INSIDE' || alm;
        $('btn-land').disabled = t.state !== 'DRONE_OUTSIDE';
        $('btn-reset').disabled = !alm;
      }

      socket.on('connect', () => $('conn').textContent = 'Server connesso, attendo hangar…');
      socket.on('disconnect', () => $('conn').textContent = 'Server irraggiungibile');
      socket.on('hangar:connected', () => $('conn').textContent = 'Hangar connesso');
      socket.on('hangar:disconnected', () => {
        $('conn').textContent = 'Hangar disconnesso';
        lastFrameAt = 0;
      });
      socket.on('hangar:error', e => {
        $('conn').textContent = 'Errore seriale: ' + e.error;
        log('errore seriale: ' + e.error, true);
      });

      socket.on('hangar:telemetry', t => {
        frames++;
        lastFrameAt = Date.now();
        pending = t;                     // conta solo l'ultimo stato
        logBuf.push({ text: new Date().toLocaleTimeString('it-IT') + '  ' + JSON.stringify(t) });
        schedule();
      });

      setInterval(() => {
        if (!lastFrameAt) return;
        const age = Date.now() - lastFrameAt;
        $('age').textContent = age < 1000 ? age + ' ms' : (age / 1000).toFixed(1) + ' s fa';
      }, 250);

      $('btn-takeoff').onclick = () => { socket.emit('drone:takeoff'); log('» CMD:TAKEOFF'); };
      $('btn-land').onclick = () => { socket.emit('drone:land'); log('» CMD:LAND'); };
      $('btn-reset').onclick = () => { socket.emit('drone:reset'); log('» CMD:RESET'); };
    })();
  </script>
</body>

</html>
